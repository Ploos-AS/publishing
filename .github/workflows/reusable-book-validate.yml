name: Reusable book validation
on:
  workflow_call:
    inputs:
      metadata:
        required: false
        type: string
        default: publication.yaml
      epub:
        required: false
        type: string
        default: ""
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Ploos Publishing
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/publishing
          path: .ploos-publishing
      - run: pip install -r .ploos-publishing/requirements.txt
      - name: Validate publication metadata
        run: python .ploos-publishing/scripts/ploos_publish.py validate "${{ inputs.metadata }}"
      - name: Install EPUBCheck
        if: inputs.epub != ''
        run: sudo apt-get update && sudo apt-get install -y epubcheck
      - name: Validate EPUB
        if: inputs.epub != ''
        run: python .ploos-publishing/scripts/ploos_publish.py epubcheck "${{ inputs.epub }}"
      - name: Qualification report
        if: inputs.epub != ''
        run: python .ploos-publishing/scripts/ploos_publish.py qualify "${{ inputs.metadata }}" --epub "${{ inputs.epub }}"
      - name: Upload qualification report
        if: inputs.epub != ''
        uses: actions/upload-artifact@v4
        with:
          name: publishing-qualification
          path: qualification-report.json
