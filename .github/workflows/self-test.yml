name: Publishing self-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run M1/M2 end-to-end self-test
        run: python tests/test_cli.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned EPUBCheck
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mvn -q dependency:copy -Dartifact=org.w3c:epubcheck:5.4.0 -DoutputDirectory="$HOME/.local/share/epubcheck"
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/sh' 'exec java -jar "$HOME/.local/share/epubcheck/epubcheck-5.4.0.jar" "$@"' > "$HOME/.local/bin/epubcheck"
          chmod +x "$HOME/.local/bin/epubcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/epubcheck" --version
      - name: EPUBCheck smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          from test_cli import make_epub
          make_epub("fixture.epub")
          PY
          python scripts/ploos_publish.py epubcheck fixture.epub
      - name: Validate pinned ONIX schema bundle
        if: ${{ hashFiles('vendor/onix/MANIFEST.yaml') != '' }}
        run: |
          python scripts/ploos_publish.py onix-schema-verify vendor/onix/MANIFEST.yaml
          test -f vendor/onix/ONIX_BookProduct_3.0_reference.xsd
          test -f vendor/onix/ONIX_BookProduct_CodeLists.xsd
          test -f vendor/onix/ONIX_XHTML_Subset.xsd
          test -f vendor/onix/ONIX_BookProduct_3.0_short.xsd
          cp tests/fixtures/publication.yaml onix-publication.yaml
          python - <<'PY'
          from pathlib import Path
          p=Path("onix-publication.yaml")
          p.write_text(p.read_text().replace("PENDING", "9780000000002", 1))
          PY
          python scripts/ploos_publish.py onix onix-publication.yaml --language nb --product epub -o qualification-onix.xml
          python scripts/ploos_publish.py onix-bundle-validate qualification-onix.xml vendor/onix/MANIFEST.yaml
      - name: Record M2 qualification candidate
        run: |
          mkdir -p qualification
          printf '{"schema_version":1,"milestone":"M2","status":"CANDIDATE","commit":"%s","self_test":"PASS","external_epubcheck":"PASS"}\n' "$GITHUB_SHA" > qualification/m2.json
      - name: Upload M2 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: publishing-m2-qualification
          path: qualification/m2.json
