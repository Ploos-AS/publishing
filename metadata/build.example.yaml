schema_version: 1
build:
  clean:
    - rm -rf dist
    - mkdir -p dist
  targets:
    web:
      command: make web
      outputs:
        - dist/web/index.html
    epub_nb:
      command: make epub-nb
      outputs:
        - dist/Tallsystemer.epub
    epub_en:
      command: make epub-en
      outputs:
        - dist/Number-Systems.epub
    pdf_nb:
      command: make pdf-nb
      outputs:
        - dist/Tallsystemer.pdf
    pdf_en:
      command: make pdf-en
      outputs:
        - dist/Number-Systems.pdf
